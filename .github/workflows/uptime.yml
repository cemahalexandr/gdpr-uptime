name: uptime

# Внешний сторож лендинга GDPR. Живет у GitHub, а не на нашем железе:
# сторож на том же сервере молчит, когда сервер лежит. Хостинг serflow не годится -
# его планировщик не выполняет задачи с 03.06.2026 (проверено 03.09.2026).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка и алерт
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
        shell: bash {0}
        run: |
          set -u
          FAILS=""
          check() {
            name="$1"; url="$2"; want="$3"; needle="${4:-}"
            for attempt in 1 2; do
              body=$(curl -s -m 20 -w '|%{http_code}' "$url" || printf '|000')
              code="${body##*|}"
              text="${body%|*}"
              ok=1
              [ "$code" = "$want" ] || ok=0
              if [ -n "$needle" ]; then
                case "$text" in *"$needle"*) : ;; *) ok=0 ;; esac
              fi
              if [ "$ok" = "1" ]; then echo "$name OK ($code)"; return 0; fi
              if [ "$attempt" = "1" ]; then sleep 20; fi
            done
            echo "$name УПАЛ (код $code)"
            FAILS="${FAILS}\n- $name: код $code вместо $want"
            return 0
          }
          check "лендинг RO" "https://gdpr.ai-platform.space/?lang=ro" 200 "lead-form"
          check "прием заявок" "https://gdpr.ai-platform.space/api/submit.php" 405 ""
          check "кабинет CRM" "https://meta-ads.ai-platform.space/api/health.php" 200 "HEALTHY"
          if [ -n "$FAILS" ]; then
            MSG=$(printf '%b' "🔴 <b>GDPR: сайт недоступен</b>${FAILS}\n\nПроверено дважды с паузой 20 секунд, внешним сторожем GitHub.\n@tsemakh")
            for chat in $(echo "$TG_CHATS" | tr ',' ' '); do
              curl -s -m 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d "chat_id=${chat}" -d "parse_mode=HTML" --data-urlencode "text=${MSG}" | head -c 120
              echo
            done
            echo "алерт отправлен"
            exit 1
          fi
          echo "все три проверки прошли"
