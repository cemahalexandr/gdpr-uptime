name: uptime

# Внешний сторож лендинга GDPR. Живет у GitHub, а не на нашем железе:
# если ляжет VPS целиком, сторож на том же VPS промолчал бы.
# Хостинг serflow для этого не годится - его планировщик не выполняет задачи с 03.06.2026 (проверено).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка и алерт
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
        run: |
          set -u
          FAILS=""

          # Две попытки с паузой: разовый сетевой сбой не повод будить людей
          check() {
            name="$1"; url="$2"; want="$3"; needle="${4:-}"
            for attempt in 1 2; do
              body=$(curl -s -m 20 -w '\n%{http_code}' "$url" || echo -e "\n000")
              code=$(printf '%s' "$body" | tail -1)
              text=$(printf '%s' "$body" | sed '$d')
              ok=1
              [ "$code" = "$want" ] || ok=0
              if [ -n "$needle" ] && ! printf '%s' "$text" | grep -q "$needle"; then ok=0; fi
              if [ "$ok" = "1" ]; then echo "$name OK ($code)"; return 0; fi
              [ "$attempt" = "1" ] && sleep 20
            done
            echo "$name УПАЛ (код $code)"
            FAILS="${FAILS}
- $name: код $code вместо $want"
            return 1
          }

          check "лендинг RO" "https://gdpr.ai-platform.space/?lang=ro" 200 "Solicita" || true
          check "прием заявок" "https://gdpr.ai-platform.space/api/submit.php" 405 || true
          check "кабинет CRM" "https://meta-ads.ai-platform.space/api/health.php" 200 "HEALTHY" || true

          if [ -n "$FAILS" ]; then
            MSG="🔴 <b>GDPR: сайт недоступен</b>${FAILS}

Проверено дважды с паузой 20 секунд, внешним сторожем GitHub.
@tsemakh"
            for chat in $(echo "$TG_CHATS" | tr ',' ' '); do
              curl -s -m 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d "chat_id=${chat}" -d "parse_mode=HTML" --data-urlencode "text=${MSG}" > /dev/null
            done
            echo "алерт отправлен"
            exit 1
          fi
          echo "все три проверки прошли"
